[project]
name = "whisprpersonal-server"
version = "0.1.0"
description = "WhisprPersonal LAN inference server"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
