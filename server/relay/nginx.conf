# Relay for native GPU mode: the server runs on Windows bound to 127.0.0.1:8001 (no firewall
# prompt for loopback), and this container keeps the published port 8000 that the phone uses.
# Docker Desktop is already allowed through Windows Firewall, so nothing needs approving.
worker_processes 1;
events { worker_connections 256; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  access_log off;
  server {
    listen 8080;
    client_max_body_size 10m;          # chunk uploads are capped at 8 MiB by the server
    proxy_read_timeout 3600s;           # live transcript WebSockets stay open for long sessions
    proxy_send_timeout 3600s;
    location / {
      proxy_pass http://host.docker.internal:8001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
