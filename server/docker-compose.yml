services:
  server:
    build: .
    image: whisprpersonal-server:local
    env_file: .env
    environment:
      MODELS_DIR: /models
      DATA_DIR: /data
      # CPU by default: on Docker Desktop for Windows (WSL2) every CUDA inference in this image
      # dies with SIGBUS (exit 135), reproduced 2026-11-17 with float16/float32/int8_float16,
      # with 64 MB and 2 GB /dev/shm, and with the model on container-local disk. CPU int8
      # transcribes 10 s of audio in about 4 s. docker-compose.gpu.yml re-enables CUDA.
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "${WHISPRPERSONAL_BIND:-0.0.0.0}:${WHISPRPERSONAL_PORT:-8000}:8000"
    volumes:
      - ./models:/models
      - ./data:/data
      - ../secrets:/run/secrets/whisprpersonal:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
